<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسعار الصرف في اليمن</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f8; padding: 15px; color: #333; }
        h1 { text-align: center; margin-bottom: 20px; color: #1a252f; font-size: 22px; }
        .city-card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .city-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 5px; }
        .currency-row { display: flex; justify-content: space-between; margin: 12px 0; font-size: 15px; align-items: center; }
        .currency-name { font-weight: bold; }
        .rates { display: flex; gap: 12px; }
        .buy { color: #27ae60; background: #eef9f2; padding: 4px 8px; border-radius: 6px; }
        .sell { color: #c0392b; background: #fdf2f2; padding: 4px 8px; border-radius: 6px; }
    </style>
</head>
<body>

    <h1>أسعار الصرف المباشرة</h1>

    <!-- أسعار صنعاء -->
    <div class="city-card">
        <div class="city-title">📍 صنعاء</div>
        <div class="currency-row">
            <span class="currency-name">🇺🇸 الدولار (USD)</span>
            <div class="rates">
                <span class="buy">شراء: <b id="sanaa-usd-buy">--</b></span>
                <span class="sell">بيع: <b id="sanaa-usd-sell">--</b></span>
            </div>
        </div>
        <div class="currency-row">
            <span class="currency-name">🇸🇦 السعودي (SAR)</span>
            <div class="rates">
                <span class="buy">شراء: <b id="sanaa-sar-buy">--</b></span>
                <span class="sell">بيع: <b id="sanaa-sar-sell">--</b></span>
            </div>
        </div>
    </div>

    <!-- أسعار عدن -->
    <div class="city-card">
        <div class="city-title">📍 عدن</div>
        <div class="currency-row">
            <span class="currency-name">🇺🇸 الدولار (USD)</span>
            <div class="rates">
                <span class="buy">شراء: <b id="aden-usd-buy">--</b></span>
                <span class="sell">بيع: <b id="aden-usd-sell">--</b></span>
            </div>
        </div>
        <div class="currency-row">
            <span class="currency-name">🇸🇦 السعودي (SAR)</span>
            <div class="rates">
                <span class="buy">شراء: <b id="aden-sar-buy">--</b></span>
                <span class="sell">بيع: <b id="aden-sar-sell">--</b></span>
            </div>
        </div>
    </div>

    <!-- مكتبات Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCxBLOWx2nMIprgzO5SQ6ntW17A5BStBMc",
            authDomain: "yemen-currency-ebfec.firebaseapp.com",
            databaseURL: "https://yemen-currency-ebfec-default-rtdb.firebaseio.com",
            projectId: "yemen-currency-ebfec",
            storageBucket: "yemen-currency-ebfec.firebasestorage.app",
            messagingSenderId: "722675106294",
            appId: "1:722675106294:web:a58a9d083f027ab83c07d7"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. عرض البيانات المخزنة سابقاً فوراً بدون انتظار
        function loadCachedData() {
            const cachedSanaa = JSON.parse(localStorage.getItem("rates_sanaa"));
            const cachedAden = JSON.parse(localStorage.getItem("rates_aden"));

            if (cachedSanaa) updateSanaaUI(cachedSanaa);
            if (cachedAden) updateAdenUI(cachedAden);
        }

        function updateSanaaUI(data) {
            document.getElementById("sanaa-usd-buy").innerText = data.usd_buy || "--";
            document.getElementById("sanaa-usd-sell").innerText = data.usd_sell || "--";
            document.getElementById("sanaa-sar-buy").innerText = data.sar_buy || "--";
            document.getElementById("sanaa-sar-sell").innerText = data.sar_sell || "--";
        }

        function updateAdenUI(data) {
            document.getElementById("aden-usd-buy").innerText = data.usd_buy || "--";
            document.getElementById("aden-usd-sell").innerText = data.usd_sell || "--";
            document.getElementById("aden-sar-buy").innerText = data.sar_buy || "--";
            document.getElementById("aden-sar-sell").innerText = data.sar_sell || "--";
        }

        // تشغيل التخزين السريع فور فتح التطبيق
        loadCachedData();

        // 2. التحديث المباشر والحفظ في الذاكرة عند اتصال Firebase
        db.ref("rates/sanaa").on("value", (snapshot) => {
            const data = snapshot.val();
            if (data) {
                updateSanaaUI(data);
                localStorage.setItem("rates_sanaa", JSON.stringify(data));
            }
        });

        db.ref("rates/aden").on("value", (snapshot) => {
            const data = snapshot.val();
            if (data) {
                updateAdenUI(data);
                localStorage.setItem("rates_aden", JSON.stringify(data));
            }
        });
    </script>
</body>
</html>
